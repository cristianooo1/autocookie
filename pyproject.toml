[project]
name = "autocookie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cristianoo", email = "cristi_iorga02@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium[atari,classic-control]>=1.3.0",
    "sb3-contrib>=2.9.0",
    "stable-baselines3[extra]>=2.9.0",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.5",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "wandb>=0.28.2",
    "weave>=0.53.6",
]

[project.scripts]
autocookie = "autocookie:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [ { index = "pytorch-cu130" } ]
torchvision = [ { index = "pytorch-cu130" } ]
torchaudio = [ { index = "pytorch-cu130" } ]
